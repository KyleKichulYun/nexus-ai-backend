version: '3.8'

services:
  api:
    build:
      context: .
      target: production
    container_name: nexus-ai-backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379 # 추가: 컨테이너 간 통신
    depends_on:
      - redis # 추가
    restart: unless-stopped

  # 새롭게 추가된 Redis 컨테이너
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - '6379:6379'
    restart: unless-stopped