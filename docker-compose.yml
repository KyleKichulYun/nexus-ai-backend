version: '3.8'

services:
  api:
    build:
      context: .
      target: production
    container_name: nexus-ai-backend
    ports:
      - '3000:3000'
    # Doppler가 주입한 환경 변수를 컨테이너로 전달
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped